name: Build MizanCode Windows Desktop

on:
  push:
    branches:
      - mizancode-flutter
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create Windows project
        shell: pwsh
        run: |
          if (Test-Path buildwin) { Remove-Item buildwin -Recurse -Force }
          flutter create --org com.mizancode --project-name mizancode --platforms=windows buildwin
          Copy-Item flutter_src/pubspec.yaml buildwin/pubspec.yaml -Force
          Copy-Item flutter_src/main.dart buildwin/lib/main.dart -Force

      - name: Prepare MizanCode Desktop
        run: python scripts/prepare_mizancode_windows.py

      - name: Get packages
        working-directory: buildwin
        run: flutter pub get

      - name: Build Windows release
        working-directory: buildwin
        run: flutter build windows --release

      - name: Package portable app
        shell: pwsh
        run: |
          $src = 'buildwin/build/windows/x64/runner/Release'
          $dst = 'MizanCode_Desktop_v4.8.1_Windows'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          Copy-Item $src $dst -Recurse
          'MizanCode Desktop v4.8.1 - Extract the ZIP completely, then run MizanCode.exe. Keep all DLL and data files together.' | Set-Content "$dst/README.txt" -Encoding UTF8
          Compress-Archive -Path "$dst/*" -DestinationPath 'MizanCode_Desktop_v4.8.1_Windows.zip' -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizanCode-Desktop-v4.8.1-Windows
          path: MizanCode_Desktop_v4.8.1_Windows.zip
          retention-days: 30

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mizancode-desktop-v4.8.1-windows
          name: MizanCode Desktop v4.8.1 Windows
          prerelease: true
          files: MizanCode_Desktop_v4.8.1_Windows.zip
