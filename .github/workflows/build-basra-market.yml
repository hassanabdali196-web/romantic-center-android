name: Build Basra Electronic Markets APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'basra_market/**'
      - 'settings.gradle'
      - '.github/workflows/build-basra-market.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify marketplace source
        run: |
          set -euo pipefail
          grep -q "أسواق البصرة الإلكترونية" basra_market/src/main/assets/index.html
          grep -q "طلب فتح متجر" basra_market/src/main/assets/index.html
          grep -q "كل متجر له سلة مستقلة" basra_market/src/main/assets/index.html
          grep -q "موافقة وفتح متجر" basra_market/src/main/assets/index.html
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :basra_market:assembleDebug
      - name: Verify APK
        run: |
          test -s basra_market/build/outputs/apk/debug/basra_market-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging basra_market/build/outputs/apk/debug/basra_market-debug.apk | grep -q "package: name='com.basra.market'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging basra_market/build/outputs/apk/debug/basra_market-debug.apk | grep -q "versionName='1.0.0'"
      - name: Prepare APK
        run: cp basra_market/build/outputs/apk/debug/basra_market-debug.apk Basra-Electronic-Markets-v1.0.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Basra-Electronic-Markets-v1.0.0-APK
          path: Basra-Electronic-Markets-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
