name: Build MizanCode Flutter APK

on:
  push:
    branches: [ "mizancode-flutter" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project shell
        run: |
          rm -rf buildapp
          flutter create --org com.mizancode --project-name mizancode --platforms=android,ios,windows buildapp
          cp flutter_src/pubspec.yaml buildapp/pubspec.yaml
          cp flutter_src/main.dart buildapp/lib/main.dart

      - name: Inject verified Google URL and v4.8 POST fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path('buildapp/lib/main.dart')
          s = main.read_text()
          exact = "https://script.google.com/macros/s/AKfycbz7zu55m1VYiMd05Jc6DIhaHlukzIoW92MDjbifU92DcIyS6JlQ1SaONV_2K3EPWo09Zg/exec"
          s = re.sub(r"const apiUrl = 'https://script\.google\.com/macros/s/[^']+/exec';", f"const apiUrl = '{exact}';", s)
          s = re.sub(r'MizanCode v4\.[0-9]+ • Google Cloud', 'MizanCode v4.8 • Google Cloud', s)

          old = """  static Future<Map<String, dynamic>> post(Map<String, dynamic> body) async {\n    final r = await http\n        .post(Uri.parse(apiUrl), headers: const {'Content-Type': 'application/json'}, body: jsonEncode(body))\n        .timeout(const Duration(seconds: 25));\n    if (r.statusCode < 200 || r.statusCode >= 400) {\n      throw Exception('HTTP ${r.statusCode}');\n    }\n    return Map<String, dynamic>.from(jsonDecode(r.body));\n  }"""

          new = """  static Future<Map<String, dynamic>> post(Map<String, dynamic> body) async {\n    final client = http.Client();\n    try {\n      final request = http.Request('POST', Uri.parse(apiUrl));\n      request.followRedirects = false;\n      request.headers['Content-Type'] = 'application/json';\n      request.body = jsonEncode(body);\n      final streamed = await client.send(request).timeout(const Duration(seconds: 25));\n\n      if (streamed.statusCode >= 300 && streamed.statusCode < 400) {\n        final location = streamed.headers['location'];\n        if (location == null || location.isEmpty) {\n          throw Exception('REDIRECT_WITHOUT_LOCATION');\n        }\n        final redirected = await client.get(Uri.parse(location)).timeout(const Duration(seconds: 25));\n        if (redirected.statusCode < 200 || redirected.statusCode >= 400) {\n          throw Exception('HTTP ${redirected.statusCode}');\n        }\n        return Map<String, dynamic>.from(jsonDecode(redirected.body));\n      }\n\n      final response = await http.Response.fromStream(streamed);\n      if (response.statusCode < 200 || response.statusCode >= 400) {\n        throw Exception('HTTP ${response.statusCode}');\n      }\n      return Map<String, dynamic>.from(jsonDecode(response.body));\n    } finally {\n      client.close();\n    }\n  }"""

          if old not in s:
              raise SystemExit('Expected Api.post block not found')
          s = s.replace(old, new)
          main.write_text(s)

          pubspec = Path('buildapp/pubspec.yaml')
          p = pubspec.read_text()
          p = re.sub(r'^version:\s*.*$', 'version: 4.8.0+48', p, flags=re.M)
          pubspec.write_text(p)
          print('Using API URL:', exact)
          print('Applied manual Google ContentService redirect handling')
          PY

      - name: Android permissions, name and MizanCode launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildapp/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>')
          s=s.replace('<application', '<application android:usesCleartextTraffic="true"')
          s=s.replace('android:label="mizancode"', 'android:label="ميزان كود"')
          s=s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/mizan_launcher" android:roundIcon="@drawable/mizan_launcher"')
          p.write_text(s)
          PY
          mkdir -p buildapp/android/app/src/main/res/drawable
          cat > buildapp/android/app/src/main/res/drawable/mizan_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#062A52" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#11D5D5" android:pathData="M50,13c0,-3 2,-5 5,-5s5,2 5,5 -2,5 -5,5 -5,-2 -5,-5z"/>
              <path android:fillColor="#11D5D5" android:pathData="M51,24h8v48h-8z"/>
              <path android:fillColor="#11D5D5" android:pathData="M20,29c20,-9 50,-9 70,0l-3,7c-18,-7 -46,-7 -64,0z"/>
              <path android:fillColor="#0A3A70" android:pathData="M19,38l-13,20c-4,6 1,14 8,14h20c7,0 12,-8 8,-14l-13,-20z"/>
              <path android:fillColor="#0A3A70" android:pathData="M79,38l-13,20c-4,6 1,14 8,14h20c7,0 12,-8 8,-14l-13,-20z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M25,49l-8,8 8,8 4,-4 -4,-4 4,-4z"/>
              <path android:fillColor="#11D5D5" android:pathData="M80,48l-5,18h5l5,-18zM84,49l8,8 -8,8 -4,-4 4,-4 -4,-4z"/>
              <path android:fillColor="#168BFF" android:pathData="M30,78c14,11 36,11 50,0l4,5c-17,14 -41,14 -58,0z"/>
          </vector>
          EOF

      - name: Get packages
        working-directory: buildapp
        run: flutter pub get

      - name: Build release APK
        working-directory: buildapp
        run: flutter build apk --release

      - name: Rename APK
        run: cp buildapp/build/app/outputs/flutter-apk/app-release.apk MizanCode_v4.8_Google_Cloud_POST_Fixed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MizanCode-v4.8-Google-Cloud-POST-Fixed
          path: MizanCode_v4.8_Google_Cloud_POST_Fixed.apk
          retention-days: 30

      - name: Publish direct-download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mizancode-v4.8-google-cloud-post-fixed
          name: MizanCode v4.8 Google Cloud POST Fixed
          prerelease: true
          files: MizanCode_v4.8_Google_Cloud_POST_Fixed.apk
