name: Build Romantic Center APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Romantic-Center.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Romantic-Center-APK
          path: Romantic-Center.apk
          if-no-files-found: error
          retention-days: 30
