name: MizanCode Desktop v6.1 Windows Build

on:
  push:
    branches:
      - mizancode-desktop-v61-20260919
    paths:
      - '.github/workflows/mizancode-desktop-v61.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare application source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path buildsrc | Out-Null
          Copy-Item 'mizancode_desktop_build/main.py' 'buildsrc/main.py' -Force
          Copy-Item 'mizancode_desktop_build/database.py' 'buildsrc/database.py' -Force
          Copy-Item 'mizancode_desktop_build/cloud_api.py' 'buildsrc/cloud_api.py' -Force
          Copy-Item 'mizancode_desktop_build/invoice.py' 'buildsrc/invoice.py' -Force
          Copy-Item 'mizancode_desktop_build/requirements.txt' 'buildsrc/requirements.txt' -Force
          Get-ChildItem buildsrc | Select-Object Name,Length

      - name: Install build dependencies
        shell: pwsh
        working-directory: buildsrc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify source and database
        shell: pwsh
        working-directory: buildsrc
        run: |
          python -m py_compile main.py database.py cloud_api.py invoice.py
          python -c "from database import Database; d=Database(); print('DB_OK', d.setting('POINTS_EARN'), d.setting('POINTS_SPEND_IQD')); d.close()"

      - name: Build EXE
        shell: pwsh
        working-directory: buildsrc
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name MizanCode_Desktop_v6.1 main.py

      - name: Verify EXE
        shell: pwsh
        working-directory: buildsrc
        run: |
          if (!(Test-Path 'dist/MizanCode_Desktop_v6.1.exe')) { throw 'EXE not generated' }
          Get-Item 'dist/MizanCode_Desktop_v6.1.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'dist/MizanCode_Desktop_v6.1.exe' -Algorithm SHA256

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MizanCode_Desktop_v6.1_Professional
          path: buildsrc/dist/MizanCode_Desktop_v6.1.exe
          if-no-files-found: error
          retention-days: 7
