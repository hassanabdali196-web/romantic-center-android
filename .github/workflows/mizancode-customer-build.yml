name: MizanCode Customer APK Build

on:
  push:
    branches:
      - mizancode-customer-build-20260919

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Build MizanCode customer APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .build/mizancode_customer_rebuild
          mkdir -p .build
          cd .build
          flutter create --platforms=android --org com.mizancode --project-name mizancode_customer_rebuild mizancode_customer_rebuild
          cat ../mizancode_customer_src/v1_6_overlay.part00 \
              ../mizancode_customer_src/v1_6_overlay.part01 \
              ../mizancode_customer_src/v1_6_overlay.part02 \
              ../mizancode_customer_src/v1_6_overlay.part03 \
              ../mizancode_customer_src/v1_6_overlay.part04 \
              ../mizancode_customer_src/v1_6_overlay.part05 | base64 -d > /tmp/mizancode_v16_overlay.tar.gz
          tar -xzf /tmp/mizancode_v16_overlay.tar.gz -C mizancode_customer_rebuild
          cd mizancode_customer_rebuild
          mkdir -p android/app/src/main/res/drawable
          cp assets/images/mizancode_logo.png android/app/src/main/res/drawable/mizancode_logo.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-$d"
            cp assets/images/mizancode_logo.png "android/app/src/main/res/mipmap-$d/ic_launcher.png"
          done
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../MizanCode_Customer_v1.6_Branded.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MizanCode_Customer_v1.6_Branded_APK
          path: MizanCode_Customer_v1.6_Branded.apk
          if-no-files-found: error
          retention-days: 7
