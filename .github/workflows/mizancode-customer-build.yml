name: MizanCode Customer APK Build

on:
  push:
    branches:
      - mizancode-customer-build-20260919

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Build MizanCode customer APK
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .build/mizancode_customer_rebuild
          mkdir -p .build
          cd .build
          flutter create --platforms=android --org com.mizancode --project-name mizancode_customer_rebuild mizancode_customer_rebuild
          cp ../mizancode_customer_src/pubspec.yaml mizancode_customer_rebuild/pubspec.yaml
          cp ../mizancode_customer_src/main.dart mizancode_customer_rebuild/lib/main.dart
          mkdir -p mizancode_customer_rebuild/android/app/src/main/kotlin/com/mizancode/mizancode_customer_rebuild
          cp ../mizancode_customer_src/MainActivity.kt mizancode_customer_rebuild/android/app/src/main/kotlin/com/mizancode/mizancode_customer_rebuild/MainActivity.kt
          cp ../mizancode_customer_src/AndroidManifest.xml mizancode_customer_rebuild/android/app/src/main/AndroidManifest.xml
          cd mizancode_customer_rebuild
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../MizanCode_Customer_v1.4_AutoPoints.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MizanCode_Customer_v1.4_AutoPoints_APK
          path: MizanCode_Customer_v1.4_AutoPoints.apk
          if-no-files-found: error
          retention-days: 7
