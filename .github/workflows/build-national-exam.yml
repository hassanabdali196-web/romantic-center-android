name: Build National Exam Iraq APK

on:
  push:
    branches: [ main ]
    paths:
      - 'national_exam/**'
      - 'settings.gradle'
      - '.github/workflows/build-national-exam.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare app asset
        run: |
          set -euo pipefail
          mkdir -p national_exam/src/main/assets
          cat national_exam/buildsrc/index.b64.part* | base64 -d | gunzip > national_exam/src/main/assets/index.html
          grep -q "الاختبار الوطني" national_exam/src/main/assets/index.html
          grep -q "window.QUESTION_BANK" national_exam/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :national_exam:assembleDebug

      - name: Verify APK
        run: |
          test -s national_exam/build/outputs/apk/debug/national_exam-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging national_exam/build/outputs/apk/debug/national_exam-debug.apk | grep -q "package: name='com.nationalexam.iraq'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging national_exam/build/outputs/apk/debug/national_exam-debug.apk | grep -q "versionName='1.0.0'"

      - name: Prepare APK
        run: cp national_exam/build/outputs/apk/debug/national_exam-debug.apk National-Exam-Iraq-v1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: National-Exam-Iraq-v1.0.0-APK
          path: National-Exam-Iraq-v1.0.0.apk
          if-no-files-found: error
          retention-days: 30
