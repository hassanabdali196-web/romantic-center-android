plugins {
    id 'com.android.application'
}

android {
    namespace 'com.basra.market'
    compileSdk 35

    defaultConfig {
        applicationId "com.basra.market"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false; shrinkResources false }
    }
}

dependencies {
}
