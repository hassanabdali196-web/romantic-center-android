name: mizancode
publish_to: 'none'
description: MizanCode unified Flutter client for business and loyalty.
version: 4.1.0+41

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  mobile_scanner: ^7.1.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/mizan_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/mizan_logo.png
  adaptive_icon_background: '#062A52'
  adaptive_icon_foreground: assets/mizan_logo.png
  windows:
    generate: true
    image_path: assets/mizan_logo.png
